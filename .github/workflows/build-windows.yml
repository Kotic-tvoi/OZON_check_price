name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'admin/**'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pyinstaller==6.16.0
      - name: Test source
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
      - name: Build EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name OzonPrices
          --hidden-import google.oauth2.service_account
          --hidden-import google.auth.transport.requests
          app/main.py
      - name: Smoke test executable
        shell: pwsh
        run: |
          & .\dist\OzonPrices\OzonPrices.exe --check-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Include private kit builder (no secrets)
        shell: pwsh
        run: |
          Copy-Item .\admin\MAKE_PRIVATE_KIT.ps1 .\dist\MAKE_PRIVATE_KIT.ps1
          Copy-Item .\admin\MAKE_PRIVATE_KIT.bat .\dist\MAKE_PRIVATE_KIT.bat
      - uses: actions/upload-artifact@v4
        with:
          name: OzonPrices-Windows-NO-SECRETS
          path: dist/
          retention-days: 14
          if-no-files-found: error
